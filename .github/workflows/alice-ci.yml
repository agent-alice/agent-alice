name: Alice regression gates

on:
  pull_request:
    paths: ['alice/**', '.github/workflows/alice-ci.yml']
  push:
    paths: ['alice/**', '.github/workflows/alice-ci.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alice-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: alice
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: alice/requirements.lock
      - name: Install the project and fixed verification tools
        run: python -m pip install -c requirements.lock -e '.[dev]'
      - name: Verify source and the actual installed candidate
        run: python tools/check.py --report build/check-report.json
      - name: Preserve verification outcome even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checks-${{ matrix.os }}-py${{ matrix.python }}
          path: alice/build/check-report.json
          if-no-files-found: error

  all-checks-passed:
    name: all checks passed
    needs: [verify]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every matrix job to succeed
        env:
          RESULT: ${{ needs.verify.result }}
        run: |
          if [ "$RESULT" != success ]; then
            echo "Required verification did not succeed: $RESULT"
            exit 1
          fi
